<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Neon Runner — 3D Game</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="game-root"></div>

  <div id="hud">
    <div id="hud-top">
      <div class="hud-stat">
        <span class="hud-label">Score</span>
        <span id="hud-score" class="hud-value">0</span>
      </div>
      <div class="hud-stat">
    <div id="hud-powerups" class="hud-powerups"></div>
        <span class="hud-label">Best</span>
        <span id="hud-best" class="hud-value">0</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Coins</span>
        <span id="hud-coins" class="hud-value">0</span>
      </div>
    </div>

    <div id="hud-dash" title="Dash energy — collect coins to fill, Shift to dash">
      <div id="hud-dash-fill"></div>
    </div>

    <button id="hud-mute" type="button" aria-pressed="false" title="Mute (M)">🔊</button>
    <button id="hud-pause" type="button" aria-label="Pause run" title="Pause run">⏸</button>

    <div id="overlay" class="overlay visible">
      <div class="overlay-card">
        <p class="overlay-kicker">3D SANDBOX</p>
        <h1 id="overlay-title">Neon Runner</h1>
        <p id="overlay-best" class="overlay-best" hidden></p>
        <p id="overlay-message">Dodge the blocks. Grab the coins. Don't stop.</p>
        <div id="overlay-stats" class="overlay-stats" hidden>
          <div class="stat">
            <span class="stat-label">Distance</span>
            <span class="stat-value" id="stat-distance">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Coins</span>
            <span class="stat-value" id="stat-coins">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Smashes</span>
            <span class="stat-value" id="stat-smashes">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Time</span>
            <span class="stat-value" id="stat-time">0s</span>
          </div>
        </div>
        <p class="overlay-controls overlay-controls-keyboard">
          <kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> lanes ·
          <kbd>Space</kbd> jump · <kbd>Shift</kbd> dash · <kbd>M</kbd> mute ·
          <kbd>P</kbd> pause
        </p>
        <p class="overlay-controls overlay-controls-touch">
          <span class="gesture">← →</span> swipe lanes ·
          <span class="gesture">↑</span> swipe jump ·
          <span class="gesture">tap</span> dash ·
          <span class="gesture">hold</span> pause
        </p>
        <div class="overlay-actions">
          <button id="overlay-button" type="button">Start Run</button>
          <button
            id="overlay-restart"
            type="button"
            class="overlay-secondary"
            title="Throw this run away and start over"
          >
            Restart Run
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../src/three-game/main.js"></script>
</body>
</html>
