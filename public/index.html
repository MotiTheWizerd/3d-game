<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="../src/css/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header__title">My Tasks</h1>
      <p class="header__subtitle">Stay organized and productive</p>
    </header>

    <main class="main">
      <div class="progress-bar-wrapper" id="progressWrapper" style="display:none;">
        <div class="progress-bar"><div class="progress-bar__fill" id="progressFill"></div></div>
      </div>

      <div class="input-section">
        <input type="text" id="taskInput" class="input-section__input" placeholder="Add a new task..." aria-label="Enter a new task">
        <button id="addBtn" class="input-section__button" aria-label="Add task">Add</button>
      </div>

      <section class="filters">
        <button class="filters__btn filters__btn--active" data-filter="all">All</button>
        <button class="filters__btn" data-filter="active">Active</button>
        <button class="filters__btn" data-filter="completed">Completed</button>
      </section>

      <ul id="taskList" class="task-list" aria-label="List of tasks"></ul>

      <footer class="footer">
        <p id="taskCount" class="footer__count">0 tasks remaining</p>
        <button id="clearCompleted" class="clear-completed-btn" style="display:none;">Clear completed</button>
      </footer>
    </main>
  </div>

  <script src="../src/js/app.js"></script>
</body>
</html>
